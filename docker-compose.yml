services:
  db:
    image: postgres:16-alpine
    container_name: bus_booking_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-10042003}
      POSTGRES_DB: ${DB_NAME:-bus_booking}
    ports:
      - "5432:5432"
    volumes:
      - bus_booking_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-bus_booking}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: bus_booking_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-10042003}
      DB_NAME: ${DB_NAME:-bus_booking}
      DB_SSLMODE: disable
      DB_TIMEZONE: ${DB_TIMEZONE:-Asia/Ho_Chi_Minh}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  bus_booking_db_data:
