#:schema https://json.schemastore.org/any.json

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build application from cmd/app
  cmd = "go build -o ./tmp/main ./cmd/app"

  # Binary after build
  bin = "./tmp/main"
  entrypoint = ["./tmp/main"]

  delay = 1000

  # Keep track changes with following extensions
  include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml"]

  # Keep track changes in directory
  include_dir = ["cmd", "internal", "config"]

  # Exclude changes directory
  exclude_dir = [
    "assets",
    "tmp",
    "vendor",
    "testdata",
    "docs",
    "migrations"
  ]

  exclude_file = []
  exclude_regex = ["_test.go"]

  exclude_unchanged = true
  follow_symlink = false

  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = true

  log = "build-errors.log"

  poll = false
  poll_interval = 0

  pre_cmd = []
  post_cmd = []

  rerun = false
  rerun_delay = 500

  args_bin = []
  full_bin = ""

  ignore_dangerous_root_dir = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  mode = ""
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  silent = false
  time = true

[misc]
  clean_on_exit = true

[proxy]
  enabled = false
  app_port = 0
  proxy_port = 0
  app_start_timeout = 0

[screen]
  clear_on_rebuild = false
  keep_scroll = true
